# ============================================================
# PiBoard - electron-builder.yml
# Configuration de l'empaquetage de l'application de bureau -- Windows
# (installeur NSIS), Linux (AppImage + .deb, x64 et arm64) et macOS
# (DMG + ZIP, Intel et Apple Silicon) -- et de la publication des mises
# a jour sur GitHub Releases.
#
# QUI CONSTRUIT QUOI : electron-builder ne sait pas produire un .deb ou
# une AppImage depuis Windows, ni un DMG hors de macOS. L'installeur
# Windows continue donc d'etre construit et publie depuis le PC de
# developpement (`npm run publish`), tandis que les paquets Linux et
# macOS sont construits par GitHub Actions (.github/workflows/
# release.yml) a chaque tag `v*` pousse. Les trois deposent leurs
# fichiers dans la MEME release GitHub, celle du tag -- avec chacun
# leur fichier de version (latest.yml, latest-linux.yml,
# latest-linux-arm64.yml, latest-mac.yml) que lit electron-updater sur
# la plateforme correspondante.
#
# Desktop application packaging configuration -- Windows (NSIS
# installer), Linux (AppImage + .deb, x64 and arm64) and macOS (DMG +
# ZIP, Intel and Apple Silicon) -- and publication of updates to
# GitHub Releases.
#
# WHO BUILDS WHAT: electron-builder cannot produce a .deb or an AppImage
# from Windows, nor a DMG outside macOS. The Windows installer therefore
# keeps being built and published from the development PC (`npm run
# publish`), while the Linux and macOS packages are built by GitHub
# Actions (.github/workflows/release.yml) on every pushed `v*` tag. All
# three drop their files into the SAME GitHub release, the tag's one --
# each with its own version file (latest.yml, latest-linux.yml,
# latest-linux-arm64.yml, latest-mac.yml) read by electron-updater on
# the matching platform.
# ============================================================

# Identifiant applicatif : chaine unique identifiant PiBoard aupres de
# Windows (entree de desinstallation dans le registre, dossier
# %APPDATA%, identite verifiee par electron-updater). Convention DNS
# inversee ; le domaine n'a pas besoin d'exister.
# NE DOIT PLUS JAMAIS CHANGER apres la premiere version publiee : les
# installations existantes ne se reconnaitraient plus et la mise a jour
# automatique cesserait de fonctionner.
#
# Application id: a unique string identifying PiBoard to Windows
# (uninstall entry in the registry, %APPDATA% folder, identity verified
# by electron-updater). Reverse-DNS convention; the domain need not
# exist. MUST NEVER CHANGE after the first published version: existing
# installations would no longer recognize themselves and automatic
# updating would stop working.
appId: com.jihemezes.piboard
productName: PiBoard
copyright: Copyright (c) 2026 EZES Jean-Michel

directories:
  output: dist
  buildResources: build

# Contenu embarque dans l'application. Les dependances de production
# declarees dans package.json sont incluses automatiquement ; on exclut
# ici ce qui n'a aucun sens sur un poste Windows : les tests, la
# documentation, et les scripts d'installation propres au Raspberry Pi.
# Content bundled into the application. Production dependencies declared
# in package.json are included automatically; we exclude here what makes
# no sense on a Windows machine: tests, documentation, and the Raspberry
# Pi installation scripts.
files:
  - electron/**
  - server/**
  - public/**
  - package.json
  - "!test/**"
  - "!docs/**"
  - "!install/**"
  - "!data/**"
  - "!dist/**"
  - "!**/*.md"
  # CHANGELOG.md fait exception : servi au runtime par la route
  # GET /api/changelog (section "Nouveautes" de l'aide integree), ce
  # n'est pas de la documentation de developpement comme README.md ou
  # docs/*.md -- son exclusion ci-dessus causait un 404 systematique sur
  # cette section, meme apres reinstallation complete. Les motifs sont
  # values dans l'ordre (comme .gitignore) : ce motif plus specifique,
  # place apres l'exclusion generale, la contredit pour ce seul fichier.
  # CHANGELOG.md is the exception: served at runtime by the
  # GET /api/changelog route (the built-in help's "What's new" section),
  # this isn't developer documentation like README.md or docs/*.md --
  # excluding it above caused a systematic 404 on that section, even
  # after a full reinstall. Patterns are evaluated in order (like
  # .gitignore): this more specific pattern, placed after the general
  # exclusion, overrides it for this one file.
  - "CHANGELOG.md"

# ARCHIVE ASAR REACTIVEE, DE FACON CIBLEE.
# Desactivee jusqu'ici (voir historique), avec une reserve explicite :
# "a reconsiderer si le nombre de fichiers devient un probleme a
# l'installation". C'est desormais le cas -- plusieurs contributeurs
# signalent un demarrage de plus en plus lent sous Windows, et
# node_modules a nettement grossi depuis (jsdom, imapflow, mailparser,
# astronomy-engine...), chacun ajoutant son lot de petits fichiers.
# Lire une archive asar unique est nettement plus rapide que d'ouvrir
# individuellement des milliers de petits fichiers -- l'ecart se
# creuse particulierement sous Windows, ou chaque acces fichier passe
# aussi par l'antivirus en temps reel.
#
# La preoccupation d'origine (express.static + fs.createReadStream ont
# besoin de vrais descripteurs de fichiers, l'emulation asar pour ces
# appels restant partielle) est traitee precisement plutot qu'evacuee :
# asarUnpack ci-dessous liste EXACTEMENT les quatre dossiers que
# express.static sert reellement (voir les 4 appels express.static()
# dans server/index.js) -- ni plus, ni moins -- qui restent donc de
# vrais fichiers sur disque, inchanges. Tout le reste (le code de
# l'app, jsdom, imapflow...) beneficie de l'archive.
#
# ASAR ARCHIVE RE-ENABLED, TARGETED.
# Disabled until now (see history), with an explicit caveat: "to be
# reconsidered if the file count becomes an install-time problem". This
# is now the case -- several contributors report an increasingly slow
# startup on Windows, and node_modules has grown substantially since
# (jsdom, imapflow, mailparser, astronomy-engine...), each adding its
# share of small files. Reading a single asar archive is markedly
# faster than opening thousands of small files individually -- the gap
# widens especially on Windows, where every file access also goes
# through real-time antivirus scanning.
#
# The original concern (express.static + fs.createReadStream need real
# file descriptors, asar's emulation for those calls staying partial)
# is addressed precisely rather than sidestepped: asarUnpack below
# lists EXACTLY the four folders express.static actually serves (see
# the 4 express.static() calls in server/index.js) -- no more, no less
# -- which therefore stay real files on disk, unchanged. Everything
# else (the app's own code, jsdom, imapflow...) benefits from the
# archive.
asar: true
asarUnpack:
  - "public/**"
  - "node_modules/gridstack/dist/**"
  - "node_modules/leaflet/dist/**"
  # Dossier entier livre (voir plus haut : la tentative d'elagage a un
  # seul fichier, via exclusion puis reinclusion, a ete abandonnee --
  # jamais verifiee sur un vrai paquet Windows, et une chaine en direct
  # qui ne fonctionne plus du tout est bien pire que 22 Mo de trop).
  # Whole folder shipped (see above: the attempt to trim it down to a
  # single file, via exclusion then re-inclusion, was abandoned -- never
  # verified against a real Windows package, and a live channel that
  # stops working entirely is far worse than 22 MB too many).
  - "node_modules/hls.js/dist/**"

win:
  target:
    - nsis
  icon: build/icon.ico
  # Remarque : le nom d'editeur affiche par Windows (publisherName) ne se
  # regle qu'a travers signtoolOptions, et n'a d'effet qu'avec un
  # certificat de signature de code configure (cscLink/cscKeyPassword).
  # Sans certificat -- notre cas pour l'instant -- ce champ est sans
  # objet ; Windows affichera "Editeur inconnu" et l'avertissement
  # SmartScreen habituel jusqu'a la mise en place d'une signature.
  #
  # Note: the publisher name shown by Windows (publisherName) is only
  # set through signtoolOptions, and only takes effect with a configured
  # code-signing certificate (cscLink/cscKeyPassword). Without a
  # certificate -- our case for now -- this field is moot; Windows will
  # show "Unknown publisher" and the usual SmartScreen warning until
  # signing is set up.

nsis:
  # Installation PAR UTILISATEUR (%LOCALAPPDATA%\Programs\PiBoard) plutot
  # que pour toute la machine. Trois consequences, toutes souhaitables
  # ici : aucune elevation UAC a l'installation, et surtout aucune a la
  # mise a jour automatique -- electron-updater ne peut pas ecrire dans
  # Program Files sans privileges, ce qui casserait silencieusement les
  # mises a jour.
  # PER-USER installation (%LOCALAPPDATA%\Programs\PiBoard) rather than
  # machine-wide. Three consequences, all desirable here: no UAC
  # elevation at install time, and above all none for automatic updates
  # -- electron-updater cannot write into Program Files without
  # privileges, which would silently break updating.
  perMachine: false
  # Installeur avec assistant plutot qu'en un clic : l'utilisateur voit
  # ce qui se passe et choisit le dossier.
  # Wizard installer rather than one-click: the user sees what happens
  # and picks the folder.
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: PiBoard
  # Les donnees (%APPDATA%\PiBoard) sont CONSERVEES a la desinstallation :
  # disposition des tuiles, cles API, photos televersees. Les effacer
  # sans le demander serait brutal, et une reinstallation retrouve tout.
  # Data (%APPDATA%\PiBoard) is KEPT on uninstall: tile layout, API keys,
  # uploaded photos. Wiping it unasked would be brutal, and a
  # reinstallation finds everything back.
  deleteAppDataOnUninstall: false
  # Etape optionnelle a l'installation : propose de telecharger ffmpeg
  # (voir build/installer.nsh pour le detail complet -- source, licence
  # GPLv3, comportement en cas d'echec). Refuser ou echouer au
  # telechargement n'empeche jamais l'installation de PiBoard elle-meme
  # de se terminer.
  # Optional step at install time: offers to download ffmpeg (see
  # build/installer.nsh for the full detail -- source, GPLv3 license,
  # behavior on failure). Declining or a failed download never prevents
  # PiBoard's own installation from completing.
  include: build/installer.nsh

# ---------------------------------------------------------------
# Linux : Raspberry Pi OS, Debian, Ubuntu, Zorin OS, Fedora...
# ---------------------------------------------------------------
# Deux formats, complementaires :
#   - .deb : le format natif de TOUTE la famille visee (Pi OS, Debian,
#     Ubuntu, Zorin sont tous derives de Debian). Installation par
#     `sudo apt install ./PiBoard-x.y.z-linux-<arch>.deb`, entree dans
#     le menu des applications, dependances resolues par apt, et
#     surtout le bac a sable de Chromium (chrome-sandbox) installe
#     avec les bons droits -- ce que l'AppImage ne peut pas garantir.
#     electron-updater sait mettre a jour un .deb (il relance dpkg via
#     pkexec, d'ou une demande de mot de passe administrateur).
#   - AppImage : un seul fichier executable, sans installation, qui
#     marche sur n'importe quelle distribution (Fedora, Arch, Mint...).
#     C'est le "paquet universel". electron-updater le remplace en
#     place, sans droits particuliers. Contraintes connues : il faut
#     libfuse2 (`sudo apt install libfuse2`, ou `libfuse2t64` sur
#     Ubuntu 24.04 / Debian Trixie), et Ubuntu 24.04+ (donc Zorin 18)
#     restreint par AppArmor les espaces de noms utilisateur dont le
#     bac a sable de Chromium a besoin -- lancer alors avec
#     `--no-sandbox`, ou preferer le .deb.
# Deux architectures : x64 (PC) et arm64 (Raspberry Pi 3/4/5 sous OS
# 64 bits). Pas de 32 bits (armv7l) : Electron 43 est la derniere serie
# a en fournir, et une image Pi OS 64 bits est de toute facon la norme
# depuis Bookworm.
#
# Linux: Raspberry Pi OS, Debian, Ubuntu, Zorin OS, Fedora...
# Two complementary formats:
#   - .deb: the native format of the WHOLE targeted family (Pi OS,
#     Debian, Ubuntu, Zorin are all Debian-derived). Installed with
#     `sudo apt install ./PiBoard-x.y.z-linux-<arch>.deb`, gets an
#     applications-menu entry, dependencies resolved by apt, and above
#     all Chromium's sandbox (chrome-sandbox) installed with the right
#     permissions -- which the AppImage cannot guarantee.
#     electron-updater knows how to update a .deb (it re-runs dpkg via
#     pkexec, hence an administrator password prompt).
#   - AppImage: a single executable file, no installation, working on
#     any distribution (Fedora, Arch, Mint...). This is the "universal
#     package". electron-updater replaces it in place, no special
#     rights needed. Known constraints: libfuse2 is required
#     (`sudo apt install libfuse2`, or `libfuse2t64` on Ubuntu 24.04 /
#     Debian Trixie), and Ubuntu 24.04+ (hence Zorin 18) restricts via
#     AppArmor the user namespaces Chromium's sandbox needs -- then
#     launch with `--no-sandbox`, or prefer the .deb.
# Two architectures: x64 (PC) and arm64 (Raspberry Pi 3/4/5 on a
# 64-bit OS). No 32-bit (armv7l): Electron 43 is the last series to
# ship it, and a 64-bit Pi OS image has been the norm since Bookworm
# anyway.
linux:
  target:
    - target: AppImage
      arch: [x64, arm64]
    - target: deb
      arch: [x64, arm64]
  # electron-builder genere lui-meme les tailles d'icone Linux a partir
  # de ce PNG 512x512 (le .ico Windows ne convient pas ici).
  # electron-builder generates the Linux icon sizes itself from this
  # 512x512 PNG (the Windows .ico is unsuitable here).
  icon: build/icon.png
  category: Utility
  synopsis: Tile-based kiosk dashboard / Tableau de bord kiosque a tuiles
  description: >-
    PiBoard - self-hosted tile dashboard (weather, traffic, TV guide,
    sports, photos, home automation...) for a wall screen or a desktop.
    Tableau de bord a tuiles auto-heberge pour un ecran mural ou un
    bureau.
  maintainer: Jean-Michel Ezes <jihemezes@users.noreply.github.com>
  vendor: Jean-Michel Ezes
  executableName: piboard
  # Fait correspondre le WM_CLASS des fenetres au fichier .desktop
  # (desktopName dans package.json) : sans cela, GNOME/KDE n'associent
  # pas la fenetre ouverte a l'icone du lanceur (icone generique dans la
  # barre des taches, "PiBoard" en double).
  # Matches the windows' WM_CLASS to the .desktop file (desktopName in
  # package.json): without it GNOME/KDE do not link the open window to
  # the launcher icon (generic icon in the taskbar, duplicate "PiBoard").
  syncDesktopName: true
  # Nom de fichier explicite : l'OS et l'architecture y figurent, pour
  # que les quatre fichiers Linux d'une meme release se distinguent au
  # premier coup d'oeil sur la page GitHub. electron-builder ecrit
  # l'architecture avec le nom propre a chaque format : x86_64 pour
  # l'AppImage, amd64 pour le .deb, arm64 pour les deux -- d'ou
  # PiBoard-1.2.3-linux-x86_64.AppImage mais PiBoard-1.2.3-linux-amd64.deb.
  # Explicit file name: OS and architecture are part of it, so the four
  # Linux files of one release tell apart at a glance on the GitHub
  # page. electron-builder spells the architecture the way each format
  # does: x86_64 for the AppImage, amd64 for the .deb, arm64 for both --
  # hence PiBoard-1.2.3-linux-x86_64.AppImage but
  # PiBoard-1.2.3-linux-amd64.deb.
  artifactName: "${productName}-${version}-linux-${arch}.${ext}"
  desktop:
    entry:
      Name: PiBoard
      Comment: Tile-based kiosk dashboard / Tableau de bord kiosque a tuiles
      Categories: Utility;Network;
      StartupWMClass: PiBoard

deb:
  # Depuis Debian Trixie / Ubuntu 24.04, plusieurs bibliotheques ont ete
  # renommees (transition "t64" : libgtk-3-0t64, libasound2t64...). Les
  # nouveaux paquets declarent "Provides: <ancien nom>", donc la liste
  # par defaut d'electron-builder reste satisfaisable ; on la redeclare
  # ici explicitement, avec les alternatives, pour ne pas dependre de
  # ce comportement implicite.
  # Since Debian Trixie / Ubuntu 24.04 several libraries were renamed
  # ("t64" transition: libgtk-3-0t64, libasound2t64...). The new
  # packages declare "Provides: <old name>", so electron-builder's
  # default list stays satisfiable; it is restated here explicitly, with
  # the alternatives, so as not to rely on that implicit behaviour.
  depends:
    - "libgtk-3-0 | libgtk-3-0t64"
    - libnotify4
    - libnss3
    - libxss1
    - libxtst6
    - xdg-utils
    - "libatspi2.0-0 | libatspi2.0-0t64"
    - libuuid1
    - libsecret-1-0
    - "libasound2 | libasound2t64"
  # Le .deb n'a pas de script de post-desinstallation qui efface
  # ~/.config/PiBoard : meme politique que Windows, les donnees
  # survivent a la desinstallation.
  # The .deb has no post-uninstall script wiping ~/.config/PiBoard: same
  # policy as Windows, data survives uninstallation.

# ---------------------------------------------------------------
# macOS : Monterey (12) et suivants, Intel et Apple Silicon
# ---------------------------------------------------------------
# La version minimale de macOS est dictee par Electron, donc par
# Chromium : Electron 43 (celui de package.json) exige macOS 12 ; la
# serie 44 exigera macOS 13. Remonter Electron dans package.json
# abandonne donc mecaniquement une version de macOS -- a verifier
# dans les "breaking changes" d'Electron avant chaque montee.
# Deux formats :
#   - DMG : l'installeur classique (glisser PiBoard dans Applications).
#   - ZIP : OBLIGATOIRE pour electron-updater sur macOS, qui ne sait
#     mettre a jour qu'a partir d'une archive zip (pas d'un DMG).
# SIGNATURE : sans certificat "Developer ID" Apple (compte developpeur
# payant), l'application n'est ni signee ni notarisee. Consequences
# assumees, documentees dans docs/LINUX-MACOS.md : Gatekeeper refuse
# l'ouverture au premier lancement (contournable par l'utilisateur), et
# electron-updater REFUSE de mettre a jour une application non signee
# sur macOS -- la mise a jour y reste donc manuelle (retelecharger le
# DMG) tant qu'aucune signature n'est en place. `identity: null` rend
# cette absence de signature explicite plutot que subie, et evite
# qu'electron-builder ne cherche un certificat sur la machine de build.
#
# macOS: Monterey (12) and later, Intel and Apple Silicon
# The minimum macOS version is dictated by Electron, hence by Chromium:
# Electron 43 (package.json's) requires macOS 12; the 44 series will
# require macOS 13. Bumping Electron in package.json therefore
# mechanically drops a macOS version -- check Electron's "breaking
# changes" before each upgrade.
# Two formats:
#   - DMG: the classic installer (drag PiBoard into Applications).
#   - ZIP: REQUIRED by electron-updater on macOS, which can only update
#     from a zip archive (not from a DMG).
# SIGNING: without an Apple "Developer ID" certificate (paid developer
# account), the application is neither signed nor notarized. Accepted
# consequences, documented in docs/LINUX-MACOS.md: Gatekeeper refuses
# the first launch (user-bypassable), and electron-updater REFUSES to
# update an unsigned application on macOS -- updating there stays
# manual (re-download the DMG) until signing is in place.
# `identity: null` makes that absence of signature explicit rather than
# incidental, and stops electron-builder from looking for a certificate
# on the build machine.
mac:
  target:
    - target: dmg
      arch: [x64, arm64]
    - target: zip
      arch: [x64, arm64]
  icon: build/icon.png
  category: public.app-category.utilities
  identity: null
  # Pas de "hardened runtime" sans signature : l'option n'a de sens
  # qu'avec la notarisation.
  # No hardened runtime without signing: the option only makes sense
  # together with notarization.
  hardenedRuntime: false
  gatekeeperAssess: false
  artifactName: "${productName}-${version}-mac-${arch}.${ext}"
  extendInfo:
    LSMinimumSystemVersion: "12.0"
    # Le serveur embarque ecoute sur 127.0.0.1 : aucune permission
    # reseau local n'est demandee par macOS, mais on declare les usages
    # pour les widgets qui pourraient en avoir besoin un jour.
    # The embedded server listens on 127.0.0.1: macOS asks for no
    # local-network permission, but usages are declared for the
    # widgets that may need them one day.
    NSLocalNetworkUsageDescription: PiBoard scans the local network for the network-scan tile.

# Publication des mises a jour. electron-builder depose ici l'installeur
# ET le fichier latest.yml que lit electron-updater. Le depot doit etre
# PUBLIC (voir electron/updater.js).
# Update publication. electron-builder drops the installer AND the
# latest.yml file read by electron-updater here. The repository must be
# PUBLIC (see electron/updater.js).
publish:
  provider: github
  owner: jihemezes
  repo: piboard
  # PUBLICATION IMMEDIATE, ET NON EN BROUILLON.
  # Par defaut, electron-builder cree la release GitHub en BROUILLON
  # (releaseType: draft), a charge pour le mainteneur d'aller la publier
  # a la main dans l'interface GitHub. Or l'API GitHub ne montre jamais
  # les brouillons a un client non authentifie : ni GET /releases/latest,
  # ni la liste GET /releases. Le Raspberry Pi, qui interroge cette API
  # pour ses mises a jour, ne voyait donc RIEN de ce qui avait ete
  # publie -- et repondait, sans mentir, que la derniere version
  # disponible etait la derniere effectivement publiee. Changer de canal
  # (stable ou toutes versions) n'y changeait rien : les deux canaux
  # ignorent les brouillons.
  #
  # PUBLISH IMMEDIATELY, NOT AS A DRAFT.
  # By default electron-builder creates the GitHub release as a DRAFT
  # (releaseType: draft), leaving the maintainer to publish it by hand in
  # GitHub's interface. But GitHub's API never shows drafts to an
  # unauthenticated client: neither GET /releases/latest nor the list
  # GET /releases. The Raspberry Pi, which queries that API for its
  # updates, therefore saw NOTHING of what had been published -- and
  # answered, truthfully, that the latest available version was the last
  # actually published one. Switching channels (stable or all versions)
  # made no difference: both ignore drafts.
  releaseType: release
