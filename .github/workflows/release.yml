# ============================================================
# PiBoard - .github/workflows/release.yml
# Construction et publication des TROIS paquets de l'application de
# bureau (Windows, Linux, macOS), a chaque tag `v*` pousse sur GitHub.
#
# HISTORIQUE (jusqu'a la 1.139.3 incluse) : ce workflow ne construisait
# que Linux et macOS. L'installeur Windows etait construit et publie a
# part, a la main, depuis le PC de developpement, par `npm run
# publish` -- parce que ce PC a longtemps ete la seule machine
# disponible pour le faire. Depuis la 1.139.4, le poste de
# developpement est passe sous macOS : il n'y a donc plus de machine
# Windows a demeure pour executer cette etape a la main, et il n'y a de
# toute facon aucune raison technique de la garder separee -- GitHub
# Actions sait tout aussi bien construire l'installeur NSIS qu'il sait
# deja construire le DMG et l'AppImage, voir le job `windows`
# ci-dessous.
#
# QUI CONSTRUIT QUOI, ET OU : les trois jobs (windows, linux, mac)
# tournent chacun sur le type de machine que leur plateforme exige --
# electron-builder ne sait produire ni .exe hors Windows, ni .deb /
# AppImage depuis Windows, ni DMG hors de macOS. GitHub Actions prete
# les trois, gratuitement pour un depot public.
#
# COMMENT CA S'ARTICULE : les trois jobs ecrivent dans la MEME release
# GitHub, celle du tag -- cree une seule fois par le job `release` ci-
# dessous, avant les trois constructions. Aucune collision possible :
# chaque plateforme a ses propres noms de fichiers ET son propre
# fichier de version pour electron-updater (latest.yml pour Windows,
# latest-linux.yml / latest-linux-arm64.yml pour Linux, latest-mac.yml
# pour macOS).
#
# UN SEUL GESTE SUFFIT DESORMAIS : `git push origin vX.Y.Z` demarre ce
# workflow et construit les trois plateformes -- plus besoin d'un
# second geste (`npm run publish`) sur une machine Windows.
# `npm run publish` / `npm run dist` restent neanmoins disponibles
# telles quelles pour qui voudrait construire un .exe localement (test
# ponctuel, machine Windows sous la main) : voir docs/WINDOWS.md.
#
# LATEST OU PRE-RELEASE : le statut de la release n'est decide ici par
# aucun job en particulier, mais par le NUMERO DE VERSION de
# package.json, lu par scripts/publish.js (suffixe semver -beta.1,
# -rc.2... = pre-release ; numero nu = latest). Les trois constructions
# lisent le meme fichier et decident donc forcement pareil, quel que
# soit l'ordre d'arrivee.
#
# Build and publication of the desktop application's THREE packages
# (Windows, Linux, macOS), on every `v*` tag pushed to GitHub.
#
# HISTORY (up to and including 1.139.3): this workflow only built Linux
# and macOS. The Windows installer was built and published separately,
# by hand, from the development PC, through `npm run publish` --
# because that PC used to be the only machine available to do it.
# Since 1.139.4 the development machine has moved to macOS: there is no
# longer a standing Windows machine to run that step by hand, and there
# was never a technical reason to keep it separate anyway -- GitHub
# Actions builds the NSIS installer just as well as it already builds
# the DMG and the AppImage, see the `windows` job below.
#
# WHO BUILDS WHAT, AND WHERE: the three jobs (windows, linux, mac) each
# run on the machine type their platform requires -- electron-builder
# can produce neither a .exe outside Windows, nor a .deb / AppImage
# from Windows, nor a DMG outside macOS. GitHub Actions lends all
# three, free of charge for a public repository.
#
# HOW IT FITS TOGETHER: all three jobs write into the SAME GitHub
# release, the tag's one -- created once by the `release` job below,
# before the three builds. No collision possible: each platform has its
# own file names AND its own version file for electron-updater
# (latest.yml for Windows, latest-linux.yml / latest-linux-arm64.yml
# for Linux, latest-mac.yml for macOS).
#
# A SINGLE STEP NOW SUFFICES: `git push origin vX.Y.Z` starts this
# workflow and builds all three platforms -- no more second step
# (`npm run publish`) needed on a Windows machine. `npm run publish` /
# `npm run dist` still work as is for anyone who wants to build a .exe
# locally (a one-off test, a Windows machine at hand): see
# docs/WINDOWS.md.
#
# LATEST OR PRE-RELEASE: the release's status is decided here by no
# particular job, but by package.json's VERSION NUMBER, read by
# scripts/publish.js (semver suffix -beta.1, -rc.2... = pre-release;
# bare number = latest). All three builds read the same file and
# therefore necessarily decide alike, whatever the order of arrival.
# ============================================================
name: Desktop packages (Windows + Linux + macOS)

on:
  push:
    tags:
      - "v*"
  # Lancement manuel depuis l'onglet Actions, sans publier : pour
  # verifier qu'une modification de la configuration construit encore,
  # avant de tagger. Les fichiers produits sont alors deposes en
  # "artifacts" du workflow, telechargeables 7 jours.
  # Manual run from the Actions tab, without publishing: to check that a
  # configuration change still builds, before tagging. The produced
  # files are then stored as workflow "artifacts", downloadable for
  # 7 days.
  workflow_dispatch:

# Le jeton automatique GITHUB_TOKEN doit pouvoir ecrire dans les
# releases : c'est lui qu'electron-builder utilise (variable GH_TOKEN),
# aucun jeton personnel a stocker.
# The automatic GITHUB_TOKEN must be allowed to write releases: it is
# what electron-builder uses (GH_TOKEN variable), no personal token to
# store.
permissions:
  contents: write

jobs:
  # Creation de la release UNE seule fois, avant les deux constructions
  # (voir scripts/githubRelease.js). Sans cela, Linux et macOS la
  # creaient chacun de leur cote : doublons, ou second job en echec.
  # Creating the release ONCE, before both builds (see
  # scripts/githubRelease.js). Without it Linux and macOS each created
  # it: duplicates, or a failing second job.
  # VERSIONS DES ACTIONS, ET POURQUOI CELLES-CI. GitHub a retire Node 20
  # de ses machines le 23 septembre 2026 : les actions qui le declaraient
  # sont depuis FORCEES sur Node 24, ce qui marche mais produit un
  # avertissement a chaque execution. Les versions ci-dessous (checkout
  # et setup-node en v5, upload-artifact en v7) declarent Node 24
  # elles-memes, ce qui fait taire l'avertissement en disant la verite
  # plutot qu'en la masquant.
  #
  # Un avertissement permanent n'est jamais anodin : on finit par ne plus
  # lire les journaux, et c'est alors un VRAI probleme qui passe pour du
  # bruit. C'est la seule raison de cette montee de version -- il n'y a
  # aucun gain fonctionnel a en attendre.
  #
  # `node-version: 22` plus bas est SANS RAPPORT : c'est le Node qui
  # execute PiBoard et electron-builder, pas celui qui execute les
  # actions. Les deux se choisissent separement, et confondre les deux
  # ferait changer la version avec laquelle l'application est construite.
  #
  # ACTION VERSIONS, AND WHY THESE. GitHub removed Node 20 from its
  # runners on 23 September 2026, so actions declaring it are FORCED onto
  # Node 24 -- which works, but warns on every run. The versions below
  # declare Node 24 themselves, silencing the warning by telling the
  # truth rather than hiding it. A permanent warning is never harmless:
  # one stops reading the logs, and a REAL problem then looks like noise.
  # `node-version: 22` below is UNRELATED: that is the Node running
  # PiBoard and electron-builder, not the one running the actions.
  release:
    name: Prepare the GitHub release
    if: github.event_name == 'push'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Create (or reuse) the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/publish.js --ensure-only

  windows:
    name: Windows (installeur NSIS)
    needs: release
    # `always()` + test du resultat : en lancement manuel, le job
    # `release` est saute, et un `needs` saute bloquerait tout.
    # `always()` + result check: on a manual run the `release` job is
    # skipped, and a skipped `needs` would block everything.
    if: always() && (needs.release.result == 'success' || needs.release.result == 'skipped')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      # `shell: bash` est necessaire ici : le shell par defaut sur un
      # runner Windows est PowerShell, qui ne comprend ni `set -o
      # pipefail` ni le `if [ ... ]` POSIX utilises ci-dessous. Git pour
      # Windows (preinstalle sur ces runners) fournit un bash.exe que
      # `shell: bash` sait trouver automatiquement -- aucune installation
      # supplementaire requise. Memes raisons de `tee`/`pipefail` que les
      # jobs Linux et macOS : recuperer le journal complet en cas
      # d'echec, sans se laisser tromper par le code de retour de `tee`.
      # `shell: bash` is required here: the default shell on a Windows
      # runner is PowerShell, which understands neither `set -o
      # pipefail` nor the POSIX `if [ ... ]` used below. Git for Windows
      # (preinstalled on these runners) ships a bash.exe that `shell:
      # bash` finds automatically -- no extra install needed. Same
      # `tee`/`pipefail` reasoning as the Linux and macOS jobs: keep the
      # full log on failure, without being fooled by `tee`'s own exit
      # code.
      - name: Build (and publish on tag)
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -o pipefail
          if [ "${{ github.event_name }}" = "push" ]; then
            npm run publish:win 2>&1 | tee build-win.log
          else
            npm run dist:win 2>&1 | tee build-win.log
          fi

      # Meme principe de verification explicite que pour Linux (voir son
      # commentaire) : on exige l'installeur ET le fichier de version
      # qu'electron-updater lit sur Windows, avant de considerer la
      # publication reussie. Le nom exact de l'installeur n'est pas fige
      # dans electron-builder.yml (pas d'`artifactName` personnalise pour
      # `win:`, a la difference de `linux:`/`mac:`) : il suit le defaut
      # d'electron-builder, "<productName> Setup <version>.exe" -- d'ou
      # un motif large plutot qu'un nom exact.
      # Same explicit-check principle as Linux (see its comment): the
      # installer AND the version file electron-updater reads on Windows
      # are both required before the publication counts as successful.
      # The installer's exact name is not pinned in electron-builder.yml
      # (no custom `artifactName` for `win:`, unlike `linux:`/`mac:`): it
      # follows electron-builder's default, "<productName> Setup
      # <version>.exe" -- hence a loose pattern rather than an exact name.
      - name: Check that the installer and the version file were produced
        shell: bash
        run: |
          missing=0
          for pattern in "dist/*.exe" "dist/latest.yml"; do
            if ! ls $pattern >/dev/null 2>&1; then
              echo "MANQUANT / MISSING: $pattern"
              missing=1
            fi
          done
          ls -la dist || true
          exit $missing

      - name: Keep the build log on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: piboard-windows-build-log
          path: build-win.log
          retention-days: 14

      - name: Keep the installer as an artifact (manual run only)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v7
        with:
          name: piboard-windows
          path: |
            dist/*.exe
            dist/latest.yml
          retention-days: 7

  linux:
    name: Linux (AppImage + deb, x64 + arm64)
    needs: release
    # `always()` + test du resultat : en lancement manuel, le job
    # `release` est saute, et un `needs` saute bloquerait tout.
    # `always()` + result check: on a manual run the `release` job is
    # skipped, and a skipped `needs` would block everything.
    if: always() && (needs.release.result == 'success' || needs.release.result == 'skipped')
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      # Les deux architectures sont construites sur cette seule machine
      # x64 : electron-builder telecharge le binaire Electron arm64
      # prebuilt et l'empaquete tel quel, sans emulation -- aucun code
      # natif n'est compile (PiBoard n'a pas de module natif).
      # Both architectures are built on this single x64 machine:
      # electron-builder downloads the prebuilt arm64 Electron binary
      # and packages it as is, no emulation -- no native code is
      # compiled (PiBoard has no native module).
      # La sortie est dupliquee dans un fichier (`tee`) pour pouvoir la
      # recuperer telle quelle en cas d'echec : sans cela, une
      # construction ratee ne laisse que le journal en ligne, que
      # personne ne pense a lire, et la release se retrouve publiee sans
      # ses fichiers Linux -- exactement ce qui est arrive a la 1.100.4.
      # `pipefail` est indispensable, sinon c'est le code de retour de
      # `tee` (toujours 0) qui serait pris pour celui de la construction.
      # The output is duplicated into a file (`tee`) so it can be
      # retrieved as is on failure: without it a failed build only
      # leaves the online log, which nobody thinks of reading, and the
      # release ends up published without its Linux files -- exactly
      # what happened to 1.100.4. `pipefail` is essential, otherwise
      # `tee`'s exit code (always 0) would be taken for the build's.
      - name: Build (and publish on tag)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -o pipefail
          if [ "${{ github.event_name }}" = "push" ]; then
            npm run publish:linux 2>&1 | tee build-linux.log
          else
            npm run dist:linux 2>&1 | tee build-linux.log
          fi

      # Verification explicite : electron-builder peut tres bien rendre
      # la main sans erreur apres n'avoir produit qu'une partie des
      # fichiers. On exige les six attendus (deux AppImage, deux .deb,
      # deux fichiers de version) avant de considerer la publication
      # reussie.
      # Explicit check: electron-builder can return without an error
      # after producing only part of the files. The six expected ones
      # (two AppImages, two .debs, two version files) are required
      # before the publication counts as successful.
      - name: Check that all six Linux files were produced
        run: |
          missing=0
          for pattern in "dist/*-linux-x86_64.AppImage" "dist/*-linux-arm64.AppImage" \
                         "dist/*-linux-amd64.deb" "dist/*-linux-arm64.deb" \
                         "dist/latest-linux.yml" "dist/latest-linux-arm64.yml"; do
            if ! ls $pattern >/dev/null 2>&1; then
              echo "MANQUANT / MISSING: $pattern"
              missing=1
            fi
          done
          ls -la dist | grep -v unpacked || true
          exit $missing

      - name: Keep the build log on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: piboard-linux-build-log
          path: build-linux.log
          retention-days: 14

      - name: Keep the packages as artifacts (manual run only)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v7
        with:
          name: piboard-linux
          path: |
            dist/*.AppImage
            dist/*.deb
            dist/latest-linux*.yml
          retention-days: 7

  mac:
    name: macOS (DMG + zip, Intel + Apple Silicon)
    needs: release
    if: always() && (needs.release.result == 'success' || needs.release.result == 'skipped')
    runs-on: macos-latest
    env:
      # Pas de certificat Apple : on le dit a electron-builder plutot que
      # de le laisser chercher (et parfois echouer) sur la machine.
      # No Apple certificate: tell electron-builder rather than letting
      # it search (and sometimes fail) on the machine.
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Build (and publish on tag)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -o pipefail
          if [ "${{ github.event_name }}" = "push" ]; then
            npm run publish:mac 2>&1 | tee build-mac.log
          else
            npm run dist:mac 2>&1 | tee build-mac.log
          fi

      - name: Keep the build log on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: piboard-mac-build-log
          path: build-mac.log
          retention-days: 14

      - name: Keep the packages as artifacts (manual run only)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v7
        with:
          name: piboard-mac
          path: |
            dist/*.dmg
            dist/*.zip
            dist/latest-mac.yml
          retention-days: 7
